<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SIGNAL LOST // 404</title>
    <link rel="icon" type="image/svg+xml" href="/todo-app/dd.svg" />
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background-color: rgb(8, 22, 30);
        color: #fff;
        font-family: system-ui, Avenir, Helvetica, Arial, sans-serif;
      }
      .wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 0 1rem;
      }
      .ver {
        letter-spacing: 3px;
        color: rgb(120, 200, 230);
        font-size: 0.8rem;
        margin-bottom: 0.5rem;
        text-transform: uppercase;
      }
      h1 {
        font-size: 6rem;
        margin: 0;
        letter-spacing: 6px;
        line-height: 1;
      }
      h2 {
        margin: 0.5rem 0 0 0;
        letter-spacing: 4px;
        text-transform: uppercase;
        color: rgb(120, 200, 230);
      }
      p {
        max-width: 480px;
        color: rgba(255, 255, 255, 0.6);
        line-height: 1.6;
        margin: 1.25rem 0 2rem 0;
      }
      a.return {
        border: 2px solid #fff;
        background: transparent;
        color: #fff;
        text-decoration: none;
        text-transform: uppercase;
        letter-spacing: 2px;
        padding: 10px 22px;
        font-size: 1.1rem;
      }
      a.return:hover {
        background: #fff;
        color: rgb(2, 79, 117);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="ver">iDROID VER 3.02 // CONNECTION ERROR</div>
      <h1>404</h1>
      <h2>Signal Lost</h2>
      <p>
        This mission could not be located on Mother Base. The coordinates may be
        outdated, or the route never existed.
      </p>
      <a class="return" href="/todo-app/">&#8592; Return to Mission List</a>
    </div>
  </body>
</html>
